name: CI

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
