<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservation Workshop Demo</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
    }
    h1 { margin-bottom: 0.5em; }
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
      background: #fafafa;
    }
    .card h2 { margin-top: 0; font-size: 1.25rem; }
    label {
      display: block;
      margin: 12px 0 4px;
      font-weight: 500;
    }
    input, select {
      width: 100%;
      padding: 8px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      margin-top: 16px;
      padding: 10px 20px;
      font-size: 1rem;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #0055aa; }
    .result {
      margin-top: 16px;
      padding: 12px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      white-space: pre-wrap;
      font-family: ui-monospace, monospace;
    }
    .result.success { border-color: #4caf50; background: #f1f8e9; }
    .result.error { border-color: #f44336; background: #ffebee; }
  </style>
</head>
<body>
  <h1>Reservation Workshop Demo</h1>
  <p>Simple UI to manually test the reservation and pricing logic.</p>

  <div class="card">
    <h2>Cancel Reservation</h2>
    <form id="cancel-form">
      <label for="reservationDate">Reservation Start (ISO or datetime)</label>
      <input type="datetime-local" id="reservationDate" required>
      <button type="submit">Check Cancellation</button>
    </form>
    <div id="cancel-result" class="result" style="display:none;"></div>
  </div>

  <div class="card">
    <h2>Calculate Price</h2>
    <form id="price-form">
      <label for="type">Room Type</label>
      <select id="type" required>
        <option value="standard">standard</option>
        <option value="premium">premium</option>
        <option value="suite">suite</option>
      </select>

      <label for="season">Season</label>
      <select id="season" required>
        <option value="low">low</option>
        <option value="high">high</option>
      </select>

      <label for="discount">Discount (0–1)</label>
      <input type="number" id="discount" step="0.01" min="0" max="1" value="0" required>

      <button type="submit">Calculate Price</button>
    </form>
    <div id="price-result" class="result" style="display:none;"></div>
  </div>

  <script>
    // Cancel form
    const cancelForm = document.getElementById('cancel-form');
    const cancelResult = document.getElementById('cancel-result');

    cancelForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const dateInput = document.getElementById('reservationDate').value;
      // Convert datetime-local to ISO
      const reservationDate = dateInput ? new Date(dateInput).toISOString() : '';

      const res = await fetch('/cancel', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reservationDate }),
      });
      const data = await res.json();

      cancelResult.style.display = 'block';
      cancelResult.className = 'result ' + (data.allowed ? 'success' : 'error');
      cancelResult.textContent = JSON.stringify(data, null, 2);
    });

    // Price form
    const priceForm = document.getElementById('price-form');
    const priceResult = document.getElementById('price-result');

    priceForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const type = document.getElementById('type').value;
      const season = document.getElementById('season').value;
      const discount = parseFloat(document.getElementById('discount').value);

      const res = await fetch('/price', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, season, discount }),
      });
      const data = await res.json();

      priceResult.style.display = 'block';
      priceResult.className = 'result ' + (data.error ? 'error' : 'success');
      priceResult.textContent = JSON.stringify(data, null, 2);
    });
  </script>
</body>
</html>
